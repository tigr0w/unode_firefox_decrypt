[project]
name = "firefox-decrypt"
version = "1.1.3+git"
description = "Firefox Decrypt is a tool to extract passwords from Mozilla (Firefox™, Waterfox™, Thunderbird®, SeaMonkey®) profiles"
authors = [{name = "Renato Alves"}]
requires-python = ">=3.9"
license = {text = "GPL-3.0-only"}
readme = "README.md"

[project.scripts]
firefox-decrypt = "firefox_decrypt:run_ffdecrypt"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
firefox-decrypt = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
nss = { version = ">=3.118,<4", channel = "conda-forge" }
